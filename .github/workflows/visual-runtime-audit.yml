name: Visual runtime audit

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "12 9 * * 1"

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture and inspect live recruiter journeys
        run: |
          mkdir -p visual-audit
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const urls = {
            portfolio: 'https://priceylewis.github.io/',
            predict: 'https://predictmygrade-demo.onrender.com/accounts/login/',
            student: 'https://priceylewis.github.io/StudentToolKit-OS-Demo/',
            academic: 'https://priceylewis.github.io/Academic-Performance-Calculator/',
            pc: 'https://priceylewis.github.io/PCPartPickerTool-Demo/',
            guardian: 'https://priceylewis.github.io/Guardian-AntiVirus/',
          };

          const failures = [];
          const consoleFindings = [];

          const assert = (condition, message) => {
            if (!condition) failures.push(message);
          };

          async function waitHealthy(page, url, timeout = 120000) {
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout });
            assert(response && response.status() < 400, url + ' HTTP status ' + (response && response.status()));
            await page.waitForTimeout(700);
          }

          function attachRuntimeChecks(page, label) {
            page.on('pageerror', error => failures.push(label + ' pageerror: ' + error.message));
            page.on('console', msg => {
              if (msg.type() === 'error') {
                const text = msg.text();
                if (!/favicon|ResizeObserver loop|Failed to load resource.*404/i.test(text)) {
                  const finding = label + ' console error: ' + text;
                  consoleFindings.push(finding);
                  if (/integrity|not available on web|uncaught/i.test(text)) {
                    failures.push(finding);
                  }
                }
              }
            });
          }

          async function checkLayout(page, label, allowHorizontal = false) {
            const result = await page.evaluate(() => {
              const root = document.documentElement;
              const body = document.body;
              return {
                innerWidth,
                scrollWidth: Math.max(root.scrollWidth, body?.scrollWidth || 0),
              };
            });
            if (!allowHorizontal) {
              assert(result.scrollWidth <= result.innerWidth + 4,
                label + ' has horizontal overflow: ' + JSON.stringify(result));
            }
          }

          async function screenshot(page, name) {
            await page.screenshot({ path: 'visual-audit/' + name + '.png', fullPage: true });
          }

          async function portfolio(browser, viewport, suffix) {
            const page = await browser.newPage({ viewport });
            attachRuntimeChecks(page, 'portfolio-' + suffix);
            await waitHealthy(page, urls.portfolio);
            await page.locator('h1').waitFor();
            await checkLayout(page, 'portfolio-' + suffix);
            await screenshot(page, 'portfolio-' + suffix);
            for (const path of ['projects/predictmygrade.html','projects/student-toolkit.html','projects/dissertation.html','projects/guardian.html','projects/pc-part-picker.html']) {
              await waitHealthy(page, urls.portfolio + path);
              await page.locator('h1').waitFor();
              await checkLayout(page, path + '-' + suffix);
              await screenshot(page, path.replaceAll('/','-').replace('.html','') + '-' + suffix);
            }
            await page.close();
          }

          async function predict(browser, viewport, suffix) {
            const page = await browser.newPage({ viewport });
            attachRuntimeChecks(page, 'predict-' + suffix);
            let ready = false;
            for (let i = 0; i < 18 && !ready; i++) {
              try {
                await waitHealthy(page, urls.predict);
                ready = await page.getByRole('button', { name: 'Continue as Demo User' }).count() > 0;
              } catch {}
              if (!ready) await page.waitForTimeout(10000);
            }
            assert(ready, 'PredictMyGrade did not become ready');
            if (ready) {
              await checkLayout(page, 'predict-login-' + suffix);
              await screenshot(page, 'predict-login-' + suffix);
              await page.getByRole('button', { name: 'Continue as Demo User' }).click();
              await page.waitForLoadState('domcontentloaded');
              await page.waitForTimeout(1200);
              await checkLayout(page, 'predict-dashboard-' + suffix);
              await screenshot(page, 'predict-dashboard-' + suffix);
              for (const path of ['/modules/','/what-if/','/settings/','/welcome/','/upgrade/']) {
                await waitHealthy(page, 'https://predictmygrade-demo.onrender.com' + path);
                await checkLayout(page, 'predict' + path + suffix);

                if (path === '/welcome/') {
                  const card = page.locator('.feature-card').first();
                  await card.waitFor();
                  const visual = await card.evaluate(element => {
                    const heading = element.querySelector('h3');
                    const body = element.querySelector('p');
                    return {
                      cardBackground: getComputedStyle(element).backgroundColor,
                      headingColor: heading ? getComputedStyle(heading).color : '',
                      bodyColor: body ? getComputedStyle(body).color : '',
                      headingText: heading?.textContent?.trim() || '',
                    };
                  });
                  assert(Boolean(visual.headingText), 'PredictMyGrade welcome feature heading is blank');
                  assert(
                    visual.headingColor !== visual.cardBackground && visual.bodyColor !== visual.cardBackground,
                    'PredictMyGrade welcome card contrast failed: ' + JSON.stringify(visual)
                  );
                }

                if (path === '/upgrade/') {
                  const comparison = page.locator('.comparison-table');
                  await comparison.waitFor({ state: 'visible', timeout: 30000 });
                  assert(
                    (await comparison.innerText()).includes('Advanced analytics'),
                    'PredictMyGrade upgrade comparison table content is missing'
                  );
                  assert(
                    await page.locator('#upgrade-alert').isHidden(),
                    'PredictMyGrade inactive upgrade alert is visible'
                  );
                }

                if (path === '/welcome/' || path === '/upgrade/') {
                  await screenshot(page, 'predict-' + path.replaceAll('/','') + '-' + suffix);
                }
              }
            }
            await page.close();
          }

          async function student(browser, viewport, suffix) {
            const page = await browser.newPage({ viewport });
            attachRuntimeChecks(page, 'student-' + suffix);
            await waitHealthy(page, urls.student);
            await page.getByText('Student Toolkit OS').waitFor({ timeout: 30000 });
            await checkLayout(page, 'student-onboarding-' + suffix);
            await screenshot(page, 'student-onboarding-' + suffix);
            const demo = page.getByText('Try Interactive Demo', { exact: true });
            if (await demo.count()) await demo.click();
            await page.getByText('Academic Performance', { exact: true }).waitFor({ timeout: 30000 });
            await page.waitForTimeout(800);
            await checkLayout(page, 'student-dashboard-' + suffix);
            await screenshot(page, 'student-dashboard-' + suffix);
            await page.close();
          }

          async function guardian(browser, viewport, suffix) {
            const page = await browser.newPage({ viewport });
            attachRuntimeChecks(page, 'guardian-' + suffix);
            await waitHealthy(page, urls.guardian);
            await page.waitForFunction(() => Boolean(window.__guardianDemo), null, { timeout: 30000 });
            await checkLayout(page, 'guardian-overview-' + suffix);
            await screenshot(page, 'guardian-overview-' + suffix);
            await page.getByRole('button', { name: 'Add suspicious sample' }).click();
            await page.getByRole('button', { name: /Quarantine/ }).click();
            assert(
              await page.locator('#toast-region .toast').count() === 0,
              'Guardian stale toast remained after navigation on ' + suffix
            );
            await page.getByRole('button', { name: 'Restore' }).waitFor();
            await page.getByRole('button', { name: 'Delete' }).waitFor();
            await checkLayout(page, 'guardian-quarantine-' + suffix);
            await screenshot(page, 'guardian-quarantine-' + suffix);
            await page.getByRole('button', { name: 'Settings' }).click();
            await checkLayout(page, 'guardian-settings-' + suffix);
            await screenshot(page, 'guardian-settings-' + suffix);
            await page.close();
          }

          async function javaApp(browser, url, prefix, readyExpression, viewport, suffix) {
            const page = await browser.newPage({ viewport });
            attachRuntimeChecks(page, prefix + '-' + suffix);
            await waitHealthy(page, url);
            await page.waitForFunction(readyExpression, null, { timeout: 180000 });
            await page.waitForTimeout(2500);
            await checkLayout(page, prefix + '-' + suffix, true);
            await screenshot(page, prefix + '-' + suffix);
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch();
            const desktop = { width: 1440, height: 1000 };
            const mobile = { width: 390, height: 844 };

            await portfolio(browser, desktop, 'desktop');
            await portfolio(browser, mobile, 'mobile');
            await predict(browser, desktop, 'desktop');
            await predict(browser, mobile, 'mobile');
            await student(browser, desktop, 'desktop');
            await student(browser, mobile, 'mobile');
            await guardian(browser, desktop, 'desktop');
            await guardian(browser, mobile, 'mobile');

            await javaApp(browser, urls.academic, 'academic',
              () => window.__academicDemoJavaReady || window.__academicDemoError, desktop, 'desktop');
            await javaApp(browser, urls.academic, 'academic',
              () => window.__academicDemoJavaReady || window.__academicDemoError, mobile, 'mobile');
            await javaApp(browser, urls.pc, 'pc-part-picker',
              () => window.__pcPartDemoJavaReady || window.__pcPartDemoError, desktop, 'desktop');
            await javaApp(browser, urls.pc, 'pc-part-picker',
              () => window.__pcPartDemoJavaReady || window.__pcPartDemoError, mobile, 'mobile');

            await browser.close();

            fs.writeFileSync('visual-audit/runtime-findings.txt',
              [...consoleFindings, ...failures].join('\n') || 'No runtime or layout failures detected.\n');

            if (consoleFindings.length) {
              console.log('Non-fatal console findings:\n' + consoleFindings.join('\n'));
            }
            if (failures.length) {
              throw new Error('Visual/runtime audit failures:\n' + failures.join('\n'));
            }
            console.log('Visual/runtime audit passed.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-visual-runtime-audit
          path: visual-audit/
          if-no-files-found: error
          retention-days: 14
