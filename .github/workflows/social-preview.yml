name: Build social preview

on:
  push:
    branches: [main]
    paths:
      - "assets/social-card.svg"
      - ".github/workflows/social-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render 1200x630 PNG
        run: rsvg-convert -w 1200 -h 630 assets/social-card.svg -o assets/social-card.png
      - name: Commit rendered image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-card.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: refresh social preview PNG"
          git push
